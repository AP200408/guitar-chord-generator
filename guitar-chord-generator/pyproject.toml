[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar-chord-generator"
version = "0.1.0"
description = "Mood-based guitar chord and progression generator"
requires-python = ">=3.10"

author = [{name = "OpenAI"}]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

documentation = ""
